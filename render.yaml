# LinkPulse - Render deployment blueprint (single web service).
# The Node server serves the API + redirect engine AND the built React SPA,
# so one Render service deploys the whole app.
#
# HOW TO USE:
#   1. Push this repo to GitHub.
#   2. On Render: New -> Blueprint -> pick this repo (Render reads render.yaml).
#   3. After it deploys, set BASE_URL to your service URL (shown below) and add
#      a Postgres DATABASE_URL (Neon/Supabase/Render Postgres). SQLite on Render's
#      ephemeral disk resets on restart, so Postgres is REQUIRED for a live demo.
#   4. Open the service URL -> /api/health should return {"ok":true}.
#      Optionally run: npm --prefix server run seed  (with DATABASE_URL set) to
#      populate demo data.
services:
  - type: web
    name: linkpulse
    runtime: node
    plan: free
    rootDir: .
    nodeVersion: 24.0.0
    healthCheckPath: /api/health
    autoDeploy: true
    buildCommand: |
      npm --prefix server install
      npm --prefix client install
      npm --prefix client run build
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true          # Render creates a strong random secret
      - key: IP_HASH_SALT
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Set this to the assigned Render URL after the first deploy, e.g.
      # https://linkpulse.onrender.com  (used to build short links & self-ref checks)
      - key: BASE_URL
        sync: false
      # Frontend origin(s) for CORS. Same-origin single-service deploy can leave
      # this as the BASE_URL value. For the split (Vercel) deploy, set to the
      # Vercel URL.
      - key: CLIENT_ORIGIN
        sync: false
      # Postgres from Neon/Supabase/Render. Format:
      # postgres://user:pass@host:5432/db?sslmode=require
      - key: DATABASE_URL
        sync: false
